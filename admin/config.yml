backend:
  name: github
  repo: abdelrahmanrashad1998-coder/dr-ahmed-mazen-website
  branch: main
  base_url: https://dr-ahmed-mazen.vercel.app
  auth_endpoint: api/auth

site_url: https://dr-ahmed-mazen.vercel.app
display_url: https://dr-ahmed-mazen.vercel.app
media_folder: "assets/before-after"
public_folder: "/assets/before-after"

collections:
  - name: "content"
    label: "Site Content"
    files:
      - label: "Press Features"
        name: "press"
        file: "_data/press.json"
        fields:
          - label: "Press Items"
            name: "items"
            widget: "list"
            fields:
              - {label: "Source Name", name: "badge", widget: "string"}
              - {label: "URL Link", name: "link", widget: "string"}
              - {label: "Arabic Summary", name: "brief_ar", widget: "text"}
              - {label: "English Summary", name: "brief_en", widget: "text"}
      - label: "FAQ Items"
        name: "faq"
        file: "_data/faq.json"
        fields:
          - label: "Questions"
            name: "items"
            widget: "list"
            fields:
              - {label: "Arabic Question", name: "q_ar", widget: "string"}
              - {label: "English Question", name: "q_en", widget: "string"}
              - {label: "Arabic Answer", name: "a_ar", widget: "text"}
              - {label: "English Answer", name: "a_en", widget: "text"}
      - label: "Results Slideshow"
        name: "results"
        file: "_data/results.json"
        fields:
          - label: "Images"
            name: "images"
            widget: "list"
            fields:
              - {label: "Image", name: "src", widget: "image"}
              - {label: "Alt Text (Optional)", name: "alt", widget: "string", default: "نتيجة حقيقية"}
